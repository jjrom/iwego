server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's bundled mime.types maps .js but not .mjs, so ES module workers
    # (e.g. maplibre-gl-worker.mjs) get served as application/octet-stream and
    # fail the browser's strict MIME check for module scripts. A bare `types {}`
    # block at server level would REPLACE the whole inherited MIME table
    # instead of extending it (an nginx gotcha) — scoping default_type to this
    # location instead only patches the one missing extension.
    location ~* \.mjs$ {
        default_type application/javascript;
    }
}
